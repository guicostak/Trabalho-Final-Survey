<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard do Survey</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#111418;--ink2:#4b5260;--muted:#8a909c;--grid:#e8eaee;--line:#d9dce2;
  --azul:#2563eb;--azul-s:#e8effd;--laranja:#e46a2e;--verde:#15803d;--verde-s:#e7f5ec;--ambar:#b45309;--ambar-s:#fdf3e3;
  --cinza-s:#eef0f3;--vermelho:#b42318;
  --d1:#b3302f;--d2:#e8807f;--d3:#d6d5cf;--d4:#6da7ec;--d5:#1c5cab;
  --sombra:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* ---------- estrutura: barra lateral fixa + conteúdo ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--grid);padding:22px 18px}
aside .marca{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
aside h1{font-size:17px;line-height:1.3;margin:6px 0 4px}
aside .autores{font-size:12px;color:var(--ink2);margin-bottom:16px}
aside nav a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:13.5px}
aside nav a:hover{background:var(--cinza-s);color:var(--ink)}
aside nav a.ativo{background:var(--azul-s);color:var(--azul);font-weight:600}
aside nav .grupo{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px;font-weight:600}
.filtros{margin-top:18px;padding-top:14px;border-top:1px solid var(--grid)}
.filtros label{display:block;font-size:12px;color:var(--ink2);margin:8px 0 3px}
select,button{font:inherit;font-size:13px;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{cursor:pointer;font-weight:500}button:hover{background:var(--cinza-s)}
.btn-prim{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-prim:hover{background:#2b3038}
.acoes{display:grid;gap:8px;margin-top:16px}
.fonte{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.45}
main{padding:28px 36px 60px;max-width:1180px;width:100%}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--grid)}main{padding:20px 16px 40px}}
/* ---------- seções ---------- */
section{margin:0 0 40px;scroll-margin-top:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
h2{font-size:22px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--ink2);margin:0 0 14px;max-width:820px}
h3{font-size:14.5px;margin:0 0 8px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sombra);padding:16px 18px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.mt{margin-top:14px}
/* KPIs */
.kpi .r{font-size:12.5px;color:var(--ink2)}.kpi .v{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.barra-prog{height:6px;background:var(--cinza-s);border-radius:9px;margin-top:10px;overflow:hidden}.barra-prog i{display:block;height:100%;background:var(--azul);border-radius:9px}
/* achados */
.achado{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--grid)}
.achado:first-child{border-top:none;padding-top:2px}
.achado .qp{font-weight:700;font-size:13px;color:var(--ink2);padding-top:2px}
.achado .pergunta{font-weight:600;margin-bottom:6px}
.hip{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:13.5px;color:var(--ink2)}
.chip{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:1.6}
.chip.ok{background:var(--verde-s);color:var(--verde)}.chip.parcial{background:var(--ambar-s);color:var(--ambar)}
.chip.nao{background:var(--cinza-s);color:var(--ink2)}.chip.desc{background:var(--azul-s);color:var(--azul)}
.aviso{background:var(--ambar-s);color:#7a3d06;border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:13.5px}
.info{background:var(--azul-s);color:#1e3a8a;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
/* tabelas */
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.rej{font-weight:650;color:var(--verde)}
.scroll{overflow-x:auto}
details{margin-top:12px}details>summary{cursor:pointer;color:var(--azul);font-weight:600;font-size:13px;list-style:none}
details>summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ ";}
details>div{margin-top:10px}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:2px 0 8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.estat{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.estat dt{color:var(--muted)}.estat dd{margin:0;font-variant-numeric:tabular-nums}
.citacao{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;color:var(--ink2);font-size:13.5px}
.citacao .t{font-size:11.5px;color:var(--muted);margin-top:2px}
svg text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#tip{position:fixed;pointer-events:none;background:#111418;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;display:none;z-index:9;max-width:300px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.desvio{padding:12px 0;border-top:1px solid var(--grid)}.desvio:first-child{border-top:none;padding-top:0}
.desvio b.id{display:inline-block;min-width:32px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11.5px}
  .app{display:block}aside nav,.filtros select,.acoes,#tip{display:none!important}
  aside{position:static;height:auto;border:none;padding:0 0 10px}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .g4{grid-template-columns:repeat(4,1fr)!important}.g2{grid-template-columns:1fr 1fr!important}
  section{break-before:page}section:first-of-type{break-before:auto}
  .scroll{overflow:visible}
}
</style>
</head>

async function lerXlsx(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Arquivo .xlsx inválido.");
  const total = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const arqs = {};
  for (let i = 0; i < total; i++) { const met = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true); arqs[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { met, tam, off }; p += 46 + nl + el + cl; }
  async function ler(nome) { const f = arqs[nome]; if (!f) return null; const ini = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), dados = u8.subarray(ini, ini + f.tam); if (f.met === 0) return td.decode(dados); const out = await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(); return td.decode(out); }
  const xml = s => new DOMParser().parseFromString(s, "application/xml");
  const ss = await ler("xl/sharedStrings.xml"), compart = ss ? [...xml(ss).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const planilha = Object.keys(arqs).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  const doc = xml(await ler(planilha)), linhas = [];
  const colIdx = ref => { const m = ref.match(/^[A-Z]+/)[0]; let n = 0; for (const ch of m) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  for (const row of doc.getElementsByTagName("row")) { const l = []; for (const c of row.getElementsByTagName("c")) { const t = c.getAttribute("t"), vEl = c.getElementsByTagName("v")[0]; let val = ""; if (t === "s") val = compart[+vEl.textContent]; else if (t === "inlineStr") val = [...c.getElementsByTagName("t")].map(x => x.textContent).join(""); else if (vEl) val = vEl.textContent; l[colIdx(c.getAttribute("r"))] = val; } linhas.push([...l].map(x => x ?? "")); }
  return linhas;
}


async function carregarArquivo(f) {
  try { const reg = f.name.toLowerCase().endsWith(".xlsx") ? S.lerTabela(await lerXlsx(await f.arrayBuffer())) : S.lerTexto(await f.text()); iniciar(reg, `${f.name} (carregado em ${dataBR(Date.now())})`); }
  catch (e) { alert("Não foi possível ler a exportação: " + e.message); }
}
