<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Dashboard do Survey</title>
<style>
:root{--ink:#1d1d1b;--ink2:#52514e;--muted:#898781;--grid:#e4e3dd;--line:#c9c8c0;--bg:#f7f7f5;--card:#ffffff;
--azul:#2a78d6;--laranja:#eb6834;--d1:#b3302f;--d2:#e8807f;--d3:#d6d5cf;--d4:#6da7ec;--d5:#1c5cab;--ok:#0c7a0c;--alerta:#a15c00;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--grid);padding:20px 24px 12px}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.barra label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
select,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{cursor:pointer}button:hover{background:#f0efea}
.acoes{margin-left:auto;display:flex;gap:8px}
nav{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
nav button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink2)}
nav button.ativo{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
main{padding:18px 0 40px}
section{display:none}section.ativo{display:block}
h2{font-size:19px;margin:22px 0 6px}h3{font-size:15px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:10px 14px}
.kpi .r{font-size:12px;color:var(--ink2)}.kpi .v{font-size:26px;font-weight:600;line-height:1.2}.kpi .n{font-size:12px;color:var(--muted)}
.aviso{border-left:4px solid var(--alerta);background:#fff8ec;padding:8px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.info{border-left:4px solid var(--azul);background:#eef5fd;padding:8px 12px;border-radius:6px;margin:10px 0;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.cap{font-size:12px;color:var(--ink2);margin-top:4px}
.rej{font-weight:600}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:4px 0}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scroll{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:#1d1d1b;color:#fff;font-size:12px;padding:5px 8px;border-radius:5px;display:none;z-index:9;max-width:280px}
.tituloimp{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  header{border:none;padding:0 0 6px}
  .barra .acoes,nav,select,#tip{display:none!important}
  .barra label{display:none}
  #filtrostxt{display:block!important}
  section{display:block!important;break-before:page}
  section:first-of-type{break-before:auto}
  .tituloimp{display:block;font-size:17px;font-weight:700;margin:0 0 6px;border-bottom:1px solid #999}
  .card{border-color:#ccc;break-inside:auto}
  .kpi,.card:has(svg),tr,li{break-inside:avoid}
  table{font-size:9.5px}th,td{padding:3px 5px}p,li{font-size:11px}
  .card{padding:8px 10px;margin:6px 0}
  .scroll{overflow:visible}
  .grid2{grid-template-columns:1fr 1fr!important}
  .soTela{display:none!important}
  table.compacta{font-size:8px}table.compacta th,table.compacta td{padding:2px 3px}
  h2{font-size:15px;margin:12px 0 4px}
}
</style>
</head>

  <p>Exportação bruta como lida (horário de Brasília), com a duração e o motivo de descarte calculados. As respostas são anônimas: o formulário não coleta nome, e-mail nem IP. ${nota}</p>
  <p class="soTela"><button id="btnTexto">${TEXTO_ORIGINAL ? "Mostrar valores codificados" : "Mostrar texto original"}</button></p>
  <div class="card scroll"><table class="compacta"><tr>${cols.map(c => `<th>${c === "dur" ? "duração (s)" : c}</th>`).join("")}</tr>${d.map(r => `<tr>${cols.map(c => `<td>${cel(r, c)}</td>`).join("")}</tr>`).join("")}</table>
  <div class="cap">Códigos: CUR = CC, ES, ADS, SI, OUTRO, NENHUM · SIT = EST14 (1º–4º), EST5 (5º+), FORM3 (formado até 3 anos), FORM3MAIS · ATU = SIM/NAO · MOM = ANTES/DEPOIS · IAU = CODIGO, ENTENDER, REVISAR, PRATICAR, NAOUSO.</div></div>`;
  document.getElementById("btnTexto").onclick = () => { TEXTO_ORIGINAL = !TEXTO_ORIGINAL; renderDados(d); };
}

// ---------------- leitura da planilha .xlsx do Forms (sem bibliotecas) ----------------
async function lerXlsx(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Arquivo .xlsx inválido.");
  const total = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const arqs = {};
  for (let i = 0; i < total; i++) { const met = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true); arqs[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { met, tam, off }; p += 46 + nl + el + cl; }
  async function ler(nome) { const f = arqs[nome]; if (!f) return null; const ini = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), dados = u8.subarray(ini, ini + f.tam); if (f.met === 0) return td.decode(dados); const out = await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(); return td.decode(out); }
  const xml = s => new DOMParser().parseFromString(s, "application/xml");
  const ss = await ler("xl/sharedStrings.xml"), compart = ss ? [...xml(ss).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const planilha = Object.keys(arqs).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  const doc = xml(await ler(planilha)), linhas = [];
  const colIdx = ref => { const m = ref.match(/^[A-Z]+/)[0]; let n = 0; for (const ch of m) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  for (const row of doc.getElementsByTagName("row")) { const l = []; for (const c of row.getElementsByTagName("c")) { const t = c.getAttribute("t"), vEl = c.getElementsByTagName("v")[0]; let val = ""; if (t === "s") val = compart[+vEl.textContent]; else if (t === "inlineStr") val = [...c.getElementsByTagName("t")].map(x => x.textContent).join(""); else if (vEl) val = vEl.textContent; l[colIdx(c.getAttribute("r"))] = val; } linhas.push([...l].map(x => x ?? "")); }
  return linhas;
}
async function carregarArquivo(f) {
  try {
    const reg = f.name.toLowerCase().endsWith(".xlsx") ? S.lerTabela(await lerXlsx(await f.arrayBuffer())) : S.lerTexto(await f.text());
    iniciar(reg, `${f.name} (carregado em ${dataBR(Date.now())})`);
  } catch (e) { alert("Não foi possível ler a exportação: " + e.message); }
}

// ---------------- início ----------------
function iniciar(reg, fonte) {
  FONTE = fonte; BASE = S.limpar(S.codificar(reg));
  document.getElementById("fonte").textContent = "Dados: " + fonte + ` · ${BASE.length} respostas · última em ${dataBR(Math.max(...BASE.map(r => r.envio)))}`;
  montarFiltros(BASE); render();
}
(function () {
  const abas = document.getElementById("abas");
  document.querySelectorAll("section").forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.dataset.nome; b.onclick = () => { document.querySelectorAll("section").forEach(x => x.classList.remove("ativo")); abas.querySelectorAll("button").forEach(x => x.classList.remove("ativo")); s.classList.add("ativo"); b.classList.add("ativo"); }; abas.appendChild(b); if (!i) { s.classList.add("ativo"); b.classList.add("ativo"); } });
  ["CUR", "SIT", "ATU", "MOM"].forEach(k => document.getElementById("f" + k).addEventListener("change", render));
  const inp = document.getElementById("arquivo");
  document.getElementById("btnCarregar").onclick = () => inp.click();
  inp.onchange = () => inp.files[0] && carregarArquivo(inp.files[0]);
  const el = document.getElementById("dados");
  iniciar(S.lerTexto(el.textContent.trim()), el.dataset.fonte);
})();
</script>
